<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - ADA Cloud</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="home">
    <section class="hero">
      <h1>Panel ADA Cloud</h1>

      <p id="estadoSesion">Verificando sesión...</p>

      <div id="datosUsuario" style="display:none;">
        <p><strong>Usuario:</strong> <span id="nombreUsuario"></span></p>
        <p><strong>Email:</strong> <span id="emailUsuario"></span></p>
        <p><strong>Rol:</strong> <span id="rolUsuario"></span></p>
      </div>

      <div class="acciones-dashboard">
        <a href="../index.html" class="btn-principal">Volver al inicio</a>
        <button id="btnSalir" class="btn-secundario">Cerrar sesión</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
