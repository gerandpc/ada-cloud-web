<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - ADA Cloud</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/bloque23-ui-refresh.css">
</head>
<body>
  <main class="login-container">
    <section class="login-card">
      <h1>ADA Cloud</h1>
      <p>Ingreso a la plataforma educativa inteligente</p>

      <form id="loginForm">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required placeholder="usuario@correo.com">

        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="Contraseña">

        <button type="submit">Ingresar</button>
      </form>

      <p id="loginMensaje"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/login.js"></script>
  <script src="../assets/js/ada-security.js"></script>
  <script src="../assets/js/ui-effects.js"></script>
</body>
</html>
