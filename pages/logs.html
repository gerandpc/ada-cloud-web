<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logs del sistema - ADA Cloud</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/bloque23-ui-refresh.css">
  <link rel="stylesheet" href="../assets/css/bloque32-auditoria.css">
</head>
<body class="module-page role-loading">
  <main class="module-shell">
    <a href="dashboard.html" class="back-link">← Volver al panel</a>
    <section class="module-view">
      <p class="eyebrow">Administración técnica</p>
      <h1>Logs del sistema</h1>
      <p>Vista de diagnóstico reservada exclusivamente al rol administrador.</p>
      <section class="panel-card audit-toolbar">
        <div><label for="logsSearch">Buscar</label><input id="logsSearch" type="search" placeholder="Mensaje, usuario u origen"></div>
        <div><label for="logsLevel">Nivel</label><select id="logsLevel"><option value="">Todos</option><option value="info">Info</option><option value="warning">Warning</option><option value="error">Error</option></select></div>
        <button class="btn-secondary" id="logsRefresh" type="button">Actualizar</button>
      </section>
      <div class="audit-summary"><strong id="logsCount">0</strong><span>logs</span></div>
      <p id="logsMessage" class="module-message"></p>
      <section class="panel-card table-wrap"><table class="data-table"><thead><tr><th>Fecha</th><th>Nivel</th><th>Origen</th><th>Mensaje</th><th>Usuario</th></tr></thead><tbody id="logsBody"><tr><td colspan="5" class="empty-cell">Cargando…</td></tr></tbody></table></section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/ada-security.js"></script>
  <script src="../assets/js/logs.js"></script>
  <script src="../assets/js/sidebar.js"></script>
</body>
</html>
