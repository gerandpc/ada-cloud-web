<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libres por materia - ADA Cloud</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/bloque25-calificaciones-boletines.css">
  <link rel="stylesheet" href="../assets/css/academic-suite.css">
  <link rel="stylesheet" href="../assets/css/ada-ui-2.css?v=2.0.0">
</head>
<body class="module-page role-loading ada-ui2">
  <main class="module-shell libres-shell">
    <a href="dashboard.html" class="back-link">← Volver al panel</a>
    <section class="module-view">
      <div class="libres-hero">
        <div>
          <h1>Libres por materia</h1>
          <p class="libres-subtitle">Registro y seguimiento de estudiantes que alcanzaron la condición de libre en una materia.</p>
        </div>
        <div class="hero-badges"><span>🧭 Seguimiento</span><span>📌 Materia</span><span>📄 Informe</span></div>
      </div>

      <div id="mensajeLibres" class="form-message" aria-live="polite">Cargando información...</div>

      <section class="toolbar-card">
        <h2>Registrar condición</h2>
        <form id="formLibreMateria">
          <div class="header-grid">
            <label>Alumno<select id="libreAlumno" required></select></label>
            <label>Curso<select id="libreCurso" required></select></label>
            <label>Materia<select id="libreMateria" required></select></label>
            <label>Fecha<input id="libreFecha" type="date" required></label>
            <label>Motivo<input id="libreMotivo" type="text" maxlength="300" required></label>
            <label>Estado<select id="libreEstado"><option value="activo">Activo</option><option value="regularizado">Regularizado</option><option value="anulado">Anulado</option></select></label>
          </div>
          <label>Observación<textarea id="libreObservacion" rows="3" maxlength="1500"></textarea></label>
          <div class="ada-action-row">
            <button type="submit" class="btn-primary">Guardar registro</button>
            <button type="button" id="exportarLibresPdf" class="btn-secondary">Generar informe PDF</button>
          </div>
        </form>
      </section>

      <section class="planilla-card">
        <h2>Registros de libres por materia</h2>
        <div id="listaLibresMateria" class="libres-grid"></div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/ada-security.js"></script>
  <script src="../assets/js/ada-export.js"></script>
  <script src="../assets/js/libres-materia.js"></script>
  <script src="../assets/js/academic-suite.js"></script>
  <script src="../assets/js/ada-ui-2.js?v=2.0.0"></script>
</body>
</html>
