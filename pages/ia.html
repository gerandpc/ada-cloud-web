
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADA IA - ADA Cloud</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/bloque23-ui-refresh.css">
  <link rel="stylesheet" href="../assets/css/bloques12-13.css">
  <link rel="stylesheet" href="../assets/css/ada-ui-2.css?v=2.0.0">
</head>
<body class="module-page role-loading ada-ui2">
  <main class="module-shell">
    <a href="dashboard.html" class="back-link">← Volver al panel</a>

    <section class="module-view">
<h1>ADA IA</h1>
      <p>Asistente institucional basado en documentos autorizados y permisos definidos para cada perfil.</p>

      <div class="ai-layout">
        <aside class="ai-sidebar">
          <h2>Contexto habilitado</h2>
          <div id="aiStatus" class="ai-status">Verificando configuración IA...</div>

          <h3>Documentos disponibles para IA</h3>
          <div id="docContextList" class="doc-context-list">
            <p class="helper-text">Cargando documentos...</p>
          </div>
        </aside>

        <section class="ai-chat">
          <h2>Chat ADA IA</h2>
          <div id="aiMessages" class="ai-messages"></div>

          <form id="aiForm" class="ai-form">
            <textarea id="aiQuestion" placeholder="Escribí una pregunta para ADA IA..." required></textarea>
            <button class="btn-primary" type="submit">Enviar</button>
          </form>
        </section>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
 <script src="../assets/js/ada-security.js"></script>
  <script src="../assets/js/ada-ia.js"></script>
  <script src="../assets/js/ui-effects.js"></script>
  <script src="../assets/js/ada-ui-2.js?v=2.0.0"></script>
</body>
</html>
