<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Auditoría final | ADA</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/qa-final.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/ada-security.js"></script>
  <link rel="stylesheet" href="../assets/css/ada-ui-2.css?v=2.0.0">

<body class="role-loading ada-ui2">
  <main class="module-shell">
    <section class="module-view">
      <div class="page-heading">
        <p class="eyebrow">ADA 1.0</p>
        <h1>Auditoría final automatizada</h1>
        <p>Controla sesión, perfil, permisos, tablas, páginas, recursos, exportaciones y conectividad sin modificar datos.</p>
      </div>
      <div class="qa-actions">
        <button id="runQa" class="btn-primary" type="button">Ejecutar auditoría</button>
        <button id="exportQa" class="btn-secondary" type="button">Descargar CSV</button>
        <button id="exportQaJson" class="btn-secondary" type="button">Descargar JSON</button>
        <button id="exportQaPdf" class="btn-secondary" type="button">Generar informe PDF</button>
      </div>
      <div id="qaSummary" class="qa-summary" aria-live="polite"></div>
      <div id="qaResults" class="qa-results"></div>
    </section>
  </main>
  <script src="../assets/js/ada-pdf.js"></script>
  <script src="../assets/js/qa-final.js"></script>
  <script src="../assets/js/ada-ui-2.js?v=2.0.0"></script>
