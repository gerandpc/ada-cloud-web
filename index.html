<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f5ff">
  <title>Ada | Iniciar sesión</title>
  <link rel="icon" type="image/jpeg" href="assets/img/ada-logo.jpg">
  <link rel="stylesheet" href="assets/css/portal-acceso.css">
</head>
<body>
  <div class="ada-scene" aria-hidden="true">
    <div class="ada-aurora ada-aurora--one"></div>
    <div class="ada-aurora ada-aurora--two"></div>
    <div class="ada-streak ada-streak--one"></div>
    <div class="ada-streak ada-streak--two"></div>
    <div class="ada-streak ada-streak--three"></div>
    <div class="ada-stars"></div>
  </div>

  <header class="ada-topbar">
    <a class="ada-mini-brand" href="index.html" aria-label="Ada, inicio">
      <img src="assets/img/ada-logo.jpg" alt="Logo de Ada">
      <span>Ada</span>
    </a>

    <button class="ada-theme-toggle" id="themeToggle" type="button" aria-label="Cambiar modo de color" aria-pressed="false">
      <span class="ada-theme-icon ada-theme-icon--sun" aria-hidden="true">☀</span>
      <span class="ada-theme-label" id="themeLabel">Claro</span>
      <span class="ada-theme-icon ada-theme-icon--moon" aria-hidden="true">☾</span>
    </button>
  </header>

  <main class="ada-login-shell">
    <section class="ada-login-card" aria-labelledby="adaTitle">
      <div class="ada-logo-wrap">
        <div class="ada-logo-halo" aria-hidden="true"></div>
        <img class="ada-logo" src="assets/img/ada-logo.jpg" alt="Logo de Ada">
      </div>

      <div class="ada-heading">
        <h1 id="adaTitle">Ada</h1>
        <p class="ada-tagline"><span aria-hidden="true">✦</span> Ada. Empowering every mind.</p>
      </div>

      <form id="portalLoginForm" class="ada-login-form" novalidate>
        <div class="ada-field">
          <label for="portalEmail">Usuario</label>
          <div class="ada-input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
            <input type="email" id="portalEmail" autocomplete="username" inputmode="email" placeholder="usuario@correo.com" required>
          </div>
        </div>

        <div class="ada-field">
          <label for="portalPassword">Contraseña</label>
          <div class="ada-input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10V8a6 6 0 0 1 12 0v2M5 10h14v11H5z"/></svg>
            <input type="password" id="portalPassword" autocomplete="current-password" placeholder="Ingresá tu contraseña" required>
            <button class="ada-password-toggle" id="passwordToggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="ada-login-options">
          <label class="ada-check">
            <input type="checkbox" id="rememberUser">
            <span aria-hidden="true"></span>
            Recordarme
          </label>
          <button class="ada-text-button" type="button" id="portalResetPassword">¿Olvidaste tu contraseña?</button>
        </div>

        <button class="ada-submit" type="submit" id="portalLoginButton">
          <span>Iniciar sesión</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>

        <p id="portalLoginMessage" class="ada-message" aria-live="polite"></p>
      </form>

      <div class="ada-status" id="adaServiceStatus" role="status">
        <span class="ada-status-dot" aria-hidden="true"></span>
        <span>Comprobando servicio...</span>
      </div>

      <footer class="ada-card-footer">
        <a href="pages/estado-sistema.html">Estado del servicio</a>
        <span>Acceso institucional seguro</span>
      </footer>
    </section>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/portal-acceso.js"></script>
</body>
</html>
